name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate shared automation
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install workflow validation tools
        run: brew install actionlint shellcheck

      - name: Validate Ruby and Fastlane
        run: |
          ruby -c scripts/apple_config.rb
          ruby test/apple_config_test.rb
          ruby test/apple_ci_version_test.rb
          bundle exec fastlane lanes

      - name: Validate shell and public-repository safety
        run: |
          actionlint .github/workflows/*.yml
          shellcheck scripts/check-secrets.sh
          scripts/check-secrets.sh
